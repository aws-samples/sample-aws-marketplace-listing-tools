AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS Marketplace Seller Toolkit — SaaS integration tester and listing effectiveness scorer

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.12

Resources:

  # ── Lambda ──────────────────────────────────────────────────────────────────

  ToolkitFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.lambda_handler
      CodeUri: ../backend/
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - aws-marketplace:ResolveCustomer
                - aws-marketplace:GetEntitlements
                - aws-marketplace:MeterUsage
                - aws-marketplace:BatchMeterUsage
                - aws-marketplace:DescribeEntity
                - aws-marketplace:ListEntities
                - bedrock:InvokeModel
                - events:ListRules
                - cloudtrail:LookupEvents
                - sts:GetCallerIdentity
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${FrontendBucket.Arn}/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /test
            Method: POST

  # ── API Gateway ──────────────────────────────────────────────────────────────

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # ── Frontend S3 + CloudFront ─────────────────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled

  # ── Custom Resource: Deploy Frontend ───────────────────────────────────────

  FrontendDeployFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: python3.12
      Timeout: 60
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${FrontendBucket.Arn}/*"
      InlineCode: |
        import boto3
        import cfnresponse
        import urllib.request

        def handler(event, context):
            try:
                if event['RequestType'] == 'Delete':
                    cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                    return

                props = event['ResourceProperties']
                html_url = props['HtmlUrl']
                dest_bucket = props['DestBucket']
                api_endpoint = props['ApiEndpoint']

                with urllib.request.urlopen(html_url) as resp:
                    html = resp.read().decode('utf-8')
                html = html.replace('__API_ENDPOINT__', api_endpoint)

                s3 = boto3.client('s3')
                s3.put_object(
                    Bucket=dest_bucket,
                    Key='index.html',
                    Body=html.encode('utf-8'),
                    ContentType='text/html',
                )

                cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Status': 'Frontend deployed'})
            except Exception as e:
                print(f'Error: {e}')
                cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  FrontendDeploy:
    Type: Custom::FrontendDeploy
    DependsOn:
      - FrontendBucketPolicy
    Properties:
      ServiceToken: !GetAtt FrontendDeployFunction.Arn
      HtmlUrl: !Sub "https://raw.githubusercontent.com/aws-samples/aws-marketplace-seller-toolkit/main/frontend/index.html"
      DestBucket: !Ref FrontendBucket
      ApiEndpoint: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/test"

Outputs:
  TestToolUrl:
    Description: Open this URL to use the AWS Marketplace Seller Toolkit
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  ApiEndpoint:
    Description: API endpoint (pre-configured in the tool)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/test"

  FrontendBucket:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket
