AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: AWS Marketplace Seller Toolkit — SaaS integration tester and listing effectiveness scorer

Globals:
  Function:
    Timeout: 60
    MemorySize: 256
    Runtime: python3.12

Resources:

  # ── Lambda ──────────────────────────────────────────────────────────────────

  ToolkitFunction:
    Type: AWS::Serverless::Function
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_116"
            comment: "DLQ not applicable — Lambda is invoked synchronously via API Gateway"
          - id: "CKV_AWS_117"
            comment: "VPC intentionally omitted — Lambda needs internet access for Marketplace APIs and Bedrock; VPC would require NAT Gateway adding cost with no security benefit"
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: "VPC intentionally omitted — Lambda needs internet access for Marketplace APIs and Bedrock; VPC would require NAT Gateway adding cost with no security benefit"
          - id: W11
            reason: "Resource * required — Marketplace APIs, Bedrock, EventBridge, and CloudTrail do not support resource-level permissions"
    Properties:
      Handler: handler.lambda_handler
      CodeUri: ../backend/
      ReservedConcurrentExecutions: 10
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - aws-marketplace:ResolveCustomer
                - aws-marketplace:GetEntitlements
                - aws-marketplace:MeterUsage
                - aws-marketplace:BatchMeterUsage
                - aws-marketplace:DescribeEntity
                - aws-marketplace:ListEntities
                - bedrock:InvokeModel
                - events:ListRules
                - cloudtrail:LookupEvents
                - sts:GetCallerIdentity
              Resource: "*"
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: !Sub "${FrontendBucket.Arn}/*"
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /test
            Method: POST

  # ── API Gateway ──────────────────────────────────────────────────────────────

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_158"
            comment: "KMS encryption intentionally omitted for this sample tool — adds cost with no security benefit for non-sensitive API Gateway access logs"
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "KMS encryption intentionally omitted for this sample tool — adds cost with no security benefit for non-sensitive API Gateway access logs"
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}"
      RetentionInDays: 30

  # ── Frontend S3 + CloudFront ─────────────────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_18"
            comment: "Access logging intentionally omitted for this sample tool"
          - id: "CKV_AWS_21"
            comment: "Versioning intentionally omitted — bucket contains only a single generated index.html"
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "Access logging intentionally omitted for this sample tool"
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      checkov:
        skip:
          - id: "CKV_AWS_86"
            comment: "CloudFront access logging intentionally omitted for this sample tool"
          - id: "CKV_AWS_68"
            comment: "WAF intentionally omitted for this sample tool — adds cost with no benefit for a static frontend"
      cfn_nag:
        rules_to_suppress:
          - id: W10
            reason: "CloudFront access logging intentionally omitted for this sample tool"
          - id: W70
            reason: "MinimumProtocolVersion TLSv1.2_2021 is set — cfn_nag may not recognise it under SAM transform"
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
          MinimumProtocolVersion: TLSv1.2_2021

  # ── Custom Resource: Deploy Frontend ───────────────────────────────────────
  # Uses the main Lambda to read index.html from its own package and upload to S3

  FrontendDeploy:
    Type: Custom::FrontendDeploy
    DependsOn:
      - FrontendBucketPolicy
    Properties:
      ServiceToken: !GetAtt ToolkitFunction.Arn
      DestBucket: !Ref FrontendBucket
      ApiEndpoint: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/test"

Outputs:
  TestToolUrl:
    Description: Open this URL to use the AWS Marketplace Seller Toolkit
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  ApiEndpoint:
    Description: API endpoint (pre-configured in the tool)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/test"

  FrontendBucket:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket
