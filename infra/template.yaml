AWSTemplateFormatVersion: "2010-09-09"
Description: AWS Marketplace SaaS Integration Tester

Parameters:
  AssetsBucketUrl:
    Type: String
    Description: Base URL of the Workshop Studio assets bucket (e.g. https://ws-assets-prod-iad-r-iad-ed304a55c2ca1aee.s3.us-east-1.amazonaws.com/WORKSHOP_ID)
    Default: ""
  AssetsBucketName:
    Type: String
    Description: Name of the S3 bucket containing the Lambda zip and frontend HTML
    Default: ""
  AssetsKeyPrefix:
    Type: String
    Description: S3 key prefix for assets (e.g. cc168d1f-b5c7-4b68-a2f9-d785d68b2f19/saas-tester)
    Default: ""

Conditions:
  HasS3Assets: !Not [!Equals [!Ref AssetsBucketName, ""]]

Resources:

  # ── Lambda ──────────────────────────────────────────────────────────────────

  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: aws-marketplace-seller-toolkit-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: mp-api-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - aws-marketplace:ResolveCustomer
                  - aws-marketplace:GetEntitlements
                  - aws-marketplace:MeterUsage
                  - aws-marketplace:BatchMeterUsage
                  - aws-marketplace:DescribeEntity
                  - aws-marketplace:ListEntities
                  - bedrock:InvokeModel
                  - events:ListRules
                  - cloudtrail:LookupEvents
                  - sts:GetCallerIdentity
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "${FrontendBucket.Arn}/*"

  LambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: aws-marketplace-seller-toolkit
      Runtime: python3.12
      Handler: handler.lambda_handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 60
      MemorySize: 256
      Code:
        !If
          - HasS3Assets
          - S3Bucket: !Ref AssetsBucketName
            S3Key: !Sub "${AssetsKeyPrefix}/function.zip"
          - ZipFile: |
              def lambda_handler(event, context):
                  return {"statusCode": 200, "body": "placeholder - update Lambda code manually"}

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/*"

  # ── API Gateway ──────────────────────────────────────────────────────────────

  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: aws-marketplace-seller-toolkit-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  Integration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunction.Arn}/invocations"
      PayloadFormatVersion: "2.0"

  Route:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: "POST /test"
      Target: !Sub "integrations/${Integration}"

  Stage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref Api
      StageName: "$default"
      AutoDeploy: true

  # ── Frontend S3 + CloudFront ─────────────────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "aws-marketplace-seller-toolkit-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: aws-marketplace-seller-toolkit-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled

  # ── Custom Resource: Deploy Frontend ───────────────────────────────────────

  FrontendDeployRole:
    Type: AWS::IAM::Role
    Condition: HasS3Assets
    Properties:
      RoleName: aws-marketplace-seller-toolkit-frontend-deploy-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: frontend-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${AssetsBucketName}/${AssetsKeyPrefix}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "${FrontendBucket.Arn}/*"

  FrontendDeployFunction:
    Type: AWS::Lambda::Function
    Condition: HasS3Assets
    Properties:
      FunctionName: aws-marketplace-seller-toolkit-frontend-deploy
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FrontendDeployRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import urllib.request

          def handler(event, context):
              try:
                  if event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  props = event['ResourceProperties']
                  source_bucket = props['SourceBucket']
                  source_key = props['SourceKey']
                  dest_bucket = props['DestBucket']
                  api_endpoint = props['ApiEndpoint']

                  s3 = boto3.client('s3')
                  resp = s3.get_object(Bucket=source_bucket, Key=source_key)
                  html = resp['Body'].read().decode('utf-8')
                  html = html.replace('__API_ENDPOINT__', api_endpoint)

                  s3.put_object(
                      Bucket=dest_bucket,
                      Key='index.html',
                      Body=html.encode('utf-8'),
                      ContentType='text/html',
                  )

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {'Status': 'Frontend deployed'})
              except Exception as e:
                  print(f'Error: {e}')
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})

  FrontendDeploy:
    Type: Custom::FrontendDeploy
    Condition: HasS3Assets
    DependsOn:
      - FrontendBucketPolicy
    Properties:
      ServiceToken: !GetAtt FrontendDeployFunction.Arn
      SourceBucket: !Ref AssetsBucketName
      SourceKey: !Sub "${AssetsKeyPrefix}/index.html"
      DestBucket: !Ref FrontendBucket
      ApiEndpoint: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/test"

Outputs:
  TestToolUrl:
    Description: Open this URL to use the SaaS Integration Tester
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"

  ApiEndpoint:
    Description: API endpoint (pre-configured in the tool)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/test"

  FrontendBucket:
    Description: S3 bucket for frontend assets
    Value: !Ref FrontendBucket
